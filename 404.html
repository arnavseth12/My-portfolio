<html lang="en">
<head>

    <link rel="icon" href="Screenshot 2025-11-06 4.45.32 PM.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 80px 20px;
            gap: 16px;
        }

        .error-code {
            font-size: 100px;
            font-weight: 700;
            color: #9DB2BF;
            line-height: 1;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: 26px;
            font-weight: 500;
            color: #27374D;
        }

        .error-desc {
            font-size: 15px;
            color: #526D82;
            max-width: 340px;
        }

        .home-btn {
            margin-top: 10px;
        }

<body>

<nav>
    <ul>
        <img src="Screenshot 2025-11-06 4.45.32 PM.png" alt="Logo" class="Logo">
        <a href="index.html"><li>Home</li></a>
        <a href="projects.html"><li>Projects</li></a>
        <a href="contact.html"><li>Contact me</li></a>
        <a href="about.html"><li>About</li></a>
    </ul>
</nav>

<div class="not-found">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-desc">Looks like this page doesn't exist. Maybe it was moved, or you followed a broken link.</p>
    <a href="index.html" class="home-btn"><button class="btn">Go home</button></a>
</div>

<script src="script.js"></script>
