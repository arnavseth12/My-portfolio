<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="icon" href="Screenshot 2025-11-06 4.45.32 PM.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
        }

        .hello-container {
            font-size: 20px;
            color: #9DB2BF;
            margin-bottom: 10px;
        }

        .letter {
            display: inline-block;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .letter:nth-child(1) { animation-delay: 0s; }
        .letter:nth-child(2) { animation-delay: 0.1s; }
        .letter:nth-child(3) { animation-delay: 0.2s; }
        .letter:nth-child(4) { animation-delay: 0.3s; }
        .letter:nth-child(5) { animation-delay: 0.4s; }
        .letter:nth-child(6) { animation-delay: 0.5s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-4px); }
        }

        .name {
            font-size: 42px;
            color: #DDE6ED;
            text-align: center;
            min-height: 56px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background: #9DB2BF;
            margin-left: 3px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
            height: 38px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .subtitle {
            font-size: 20px;
            color: #9DB2BF;
            font-weight: 400;
            margin-top: 8px;
            text-align: center;
        }

        .skills-section {
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .skills-section h2 {
            font-size: 26px;
            color: #DDE6ED;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .skill-item {
            margin-bottom: 18px;
        }

        .skill-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #9DB2BF;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .skill-bar-bg {
            background: #27374D;
            border-radius: 20px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }

        .skill-bar-fill {
            height: 10px;
            border-radius: 20px;
            background: #526D82;
            width: 0%;
            transition: width 1s ease;
        }

        .cta {
            text-align: center;
            margin: 20px 0 10px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .github {
            text-align: center;
            margin: 20px 0 40px;
        }

        .github img {
            width: 32px;
            height: 32px;
            transition: opacity 0.2s;
            filter: invert(1);
        }

        .github img:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <img src="Screenshot 2025-11-06 4.45.32 PM.png" alt="Logo" class="Logo">
        <a href="index.html"><li>Home</li></a>
        <a href="projects.html"><li>Projects</li></a>
        <a href="contact.html"><li>Contact me</li></a>
        <a href="about.html"><li>About</li></a>
    </ul>
</nav>

<div class="hero fade-in">
    <div class="hello-container">
        <span class="letter">H</span>
        <span class="letter">e</span>
        <span class="letter">l</span>
        <span class="letter">l</span>
        <span class="letter">o</span>
        <span class="letter">,</span>
    </div>
    <h1 class="name"><span id="typewriter"></span><span class="cursor"></span></h1>
    <p class="subtitle">I am an aspiring Full-Stack Developer</p>
</div>

<div class="skills-section fade-in">
    <h2>My Skills</h2>

    <div class="skill-item">
        <div class="skill-label"><span>HTML</span><span>90%</span></div>
        <div class="skill-bar-bg"><div class="skill-bar-fill" data-width="90"></div></div>
    </div>

    <div class="skill-item">
        <div class="skill-label"><span>CSS</span><span>80%</span></div>
        <div class="skill-bar-bg"><div class="skill-bar-fill" data-width="80"></div></div>
    </div>

    <div class="skill-item">
        <div class="skill-label"><span>JavaScript</span><span>65%</span></div>
        <div class="skill-bar-bg"><div class="skill-bar-fill" data-width="65"></div></div>
    </div>

    <div class="skill-item">
        <div class="skill-label"><span>Python</span><span>55%</span></div>
        <div class="skill-bar-bg"><div class="skill-bar-fill" data-width="55"></div></div>
    </div>
</div>

<div class="cta fade-in">
    <a href="contact.html"><button class="btn">Contact Me</button></a>
    <a href="projects.html"><button class="btn">My Projects</button></a>
</div>

<div class="github fade-in">
    <a href="http://github.com/arnavseth12" target="_blank">
        <img src="Github-no-background.png" alt="GitHub logo">
    </a>
</div>

<script src="script.js"></script>
<script>
    typeWriter('typewriter', "I'm Arnav", 90);

    const bars = document.querySelectorAll('.skill-bar-fill');
    const barObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const fill = entry.target;
                fill.style.width = fill.dataset.width + '%';
                barObserver.unobserve(fill);
            }
        });
    }, { threshold: 0.3 });
    bars.forEach(bar => barObserver.observe(bar));
</script>



</body>
</html>
