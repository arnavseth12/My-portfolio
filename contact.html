<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me</title>
    <link rel="icon" href="Screenshot 2025-11-06 4.45.32 PM.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-wrapper {
            max-width: 560px;
            margin: 60px auto;
            padding: 0 20px 80px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 600;
            color: #DDE6ED;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #9DB2BF;
            font-size: 13px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .field-group {
            position: relative;
            margin-bottom: 36px;
        }

        .field-group input,
        .field-group textarea {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid #526D82;
            outline: none;
            color: #DDE6ED;
            padding: 12px 0 6px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
            resize: vertical;
        }

        .field-group textarea {
            min-height: 80px;
        }

        .field-group input:focus,
        .field-group textarea:focus {
            border-bottom-color: #9DB2BF;
        }

        .field-group label {
            position: absolute;
            left: 0;
            top: 12px;
            font-size: 15px;
            color: #526D82;
            font-family: 'Poppins', sans-serif;
            pointer-events: none;
            transition: top 0.2s ease, font-size 0.2s ease, color 0.2s ease;
        }

        .field-group input:focus + label,
        .field-group input:not(:placeholder-shown) + label,
        .field-group textarea:focus + label,
        .field-group textarea:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 11px;
            color: #9DB2BF;
            letter-spacing: 0.5px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 480px) {
            .two-col { grid-template-columns: 1fr; }
        }

        .submit-btn {
            background: none;
            color: #9DB2BF;
            border: 1px solid #526D82;
            padding: 12px 44px;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.25s, color 0.25s;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #526D82;
            color: #DDE6ED;
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-msg .checkmark {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-msg h2 {
            color: #DDE6ED;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .success-msg p {
            color: #9DB2BF;
            font-size: 15px;
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <img src="Screenshot 2025-11-06 4.45.32 PM.png" alt="Logo" class="Logo">
        <a href="index.html"><li>Home</li></a>
        <a href="projects.html"><li>Projects</li></a>
        <a href="contact.html"><li>Contact me</li></a>
        <a href="about.html"><li>About</li></a>
    </ul>
</nav>

<div class="contact-wrapper">
    <h1 class="page-title fade-in">Get in touch</h1>
    <p class="page-subtitle fade-in">I'd love to hear from you *if it does not work email me at arnavseth26@gmail.com</p>

    <form id="contact-form" action="https://formspree.io/f/manlrakp" method="post" class="fade-in">
        <div class="two-col">
            <div class="field-group">
                <input type="text" id="name" name="name" placeholder=" " required>
                <label for="name">Your Name</label>
            </div>
            <div class="field-group">
                <input type="email" id="email" name="email" placeholder=" " required>
                <label for="email">Your Email</label>
            </div>
        </div>

        <div class="field-group">
            <textarea id="message" name="message" placeholder=" " rows="4" required></textarea>
            <label for="message">Message</label>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <div class="success-msg" id="success-msg">
        <div class="checkmark">✓</div>
        <h2>Message sent!</h2>
        <p>Thanks for reaching out — I'll get back to you soon.</p>
    </div>
</div>

<script src="script.js"></script>
<script>
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = new FormData(form);
        try {
            const res = await fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
                form.style.display = 'none';
                successMsg.style.display = 'block';
            } else {
                alert('Something went wrong. Please try again.');
            }
        } catch {
            alert('Something went wrong. Please try again.');
        }
    });
</script>

</body>
</html>
